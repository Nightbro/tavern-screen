<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tavern Screen — GM</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Tavern Screen</h1>
  </header>

  <div class="workspace">

    <!-- ── Left: Map Library ── -->
    <aside class="panel" id="panel-maps">
      <div class="panel-header">
        <span class="panel-title">Maps</span>
        <button id="btn-add-maps" class="btn-primary">+ Add</button>
      </div>
      <div id="map-library"></div>
    </aside>

    <!-- ── Center: Monitor selector + Preview ── -->
    <main class="panel" id="panel-center">

      <div class="section-title">Monitors</div>
      <div id="monitor-map"></div>
      <div id="monitor-list"></div>

      <div class="section-title preview-title">
        Player Screen Preview
        <button id="btn-refresh-preview" class="btn-ghost-sm" title="Refresh preview">↺</button>
      </div>
      <div id="preview-wrap">
        <div id="preview-placeholder">No player screen open</div>
        <img id="preview-img" alt="Player screen preview" style="display:none" />
      </div>

      <div class="center-footer">
        <button id="btn-close-screen" class="btn-danger" disabled>Close Player Screen</button>
      </div>

    </main>

    <!-- ── Right: Settings ── -->
    <aside class="panel" id="panel-settings">
      <div class="panel-title">Screen Settings</div>

      <div class="settings-group">
        <div class="settings-group-title">Grid</div>

        <label class="toggle-row">
          <span>Show grid</span>
          <input type="checkbox" id="grid-visible" checked />
        </label>

        <label class="field-row">
          <span>Cell size</span>
          <div class="input-unit">
            <input type="number" id="cell-size" value="1.0" min="0.25" max="4" step="0.25" />
            <span class="unit">inch</span>
          </div>
        </label>

        <label class="field-row">
          <span>Color</span>
          <input type="color" id="grid-color" value="#ffffff" />
        </label>

        <label class="field-row">
          <span>Opacity</span>
          <div class="slider-row">
            <input type="range" id="grid-opacity" min="0" max="100" value="25" />
            <span class="slider-val" id="grid-opacity-val">25%</span>
          </div>
        </label>
      </div>

      <div class="settings-group">
        <div class="settings-group-title">Calibration</div>
        <label class="field-row">
          <span>DPI</span>
          <div class="input-unit">
            <input type="number" id="dpi" value="96" min="48" max="600" step="1" />
            <span class="unit">px / inch</span>
          </div>
        </label>
        <p class="hint">Auto-suggested from display scale factor. Adjust until one grid cell measures 1 inch physically.</p>
      </div>

      <div class="settings-group">
        <div class="settings-group-title">Zoom</div>
        <div class="zoom-controls">
          <button class="btn-icon" id="zoom-out">−</button>
          <span id="zoom-val">100%</span>
          <button class="btn-icon" id="zoom-in">+</button>
          <button class="btn-ghost" id="zoom-reset">Reset</button>
        </div>
        <input type="range" id="zoom-slider" min="25" max="400" value="100" step="5" />
      </div>

    </aside>

  </div>

  <script src="gm.js"></script>
</body>
</html>
